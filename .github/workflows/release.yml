name: release

# A tag v<version> publishes the two images to GHCR under this organisation:
#   ghcr.io/beamreach-ai/compass:<version>            (the daemon, API and CLI)
#   ghcr.io/beamreach-ai/compass-dashboard:<version>
# plus :latest. docker-compose.yml pulls them by COMPASS_VERSION.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/compass
  DASHBOARD_IMAGE: ghcr.io/${{ github.repository_owner }}/compass-dashboard

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches pyproject.toml
        run: |
          pkg=$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          [ "$pkg" = "${{ steps.version.outputs.version }}" ] || { echo "tag ${GITHUB_REF_NAME} but pyproject says $pkg"; exit 1; }
      - run: pip install build && python -m build --wheel
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: dashboard/Dockerfile.dashboard
          platforms: linux/amd64,linux/arm64
          build-args: NEXT_PUBLIC_EDITION=open
          push: true
          tags: |
            ${{ env.DASHBOARD_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.DASHBOARD_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
