name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# a new push to a pull request cancels the run it replaces
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,anthropic]" ruff
      - run: ruff check .
      - run: pytest -q
        env:
          # moto fakes AWS; nothing here reaches the network
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing

  # the map benchmark at 10k on the SQLite store, budgets enforced (docs/benchmark.md); seconds
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -m benchmark tests/benchmark -q -s

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_EDITION: open

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    # The two images build from this tree; they are published on a tag.
    runs-on: ubuntu-latest
    needs: [python, dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build packaging && python -m build --wheel
      - run: docker build -f docker/Dockerfile -t compass/open:ci .
      - run: docker build -f dashboard/Dockerfile.dashboard --build-arg NEXT_PUBLIC_EDITION=open -t compass/open-dashboard:ci .
      - run: docker run --rm compass/open:ci --help
      - run: docker build -f docker/updater/Dockerfile -t compass/open-updater:ci .
      - run: sh -n docker/updater/updater.sh
      - run: python .github/scripts/release_feed.py notes "$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"

  e2e:
    # The end-to-end suite, the tests this change needs (.github/workflows/e2e.yml); its
    # last job, "e2e / e2e", is the check the branch rule requires.
    if: github.event_name == 'pull_request'
    needs: [python, dashboard]
    uses: ./.github/workflows/e2e.yml
    with:
      full: false
