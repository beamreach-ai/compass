name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,anthropic]" ruff
      - run: ruff check .
      - run: pytest -q
        env:
          # moto fakes AWS; nothing here reaches the network
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_EDITION: open

  images:
    # The two images build from this tree; they are published on a tag.
    runs-on: ubuntu-latest
    needs: [python, dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build packaging && python -m build --wheel
      - run: docker build -f docker/Dockerfile -t compass/open:ci .
      - run: docker build -f dashboard/Dockerfile.dashboard --build-arg NEXT_PUBLIC_EDITION=open -t compass/open-dashboard:ci .
      - run: docker run --rm compass/open:ci --help
      - run: docker build -f docker/updater/Dockerfile -t compass/open-updater:ci .
      - run: sh -n docker/updater/updater.sh
      - run: python .github/scripts/release_feed.py notes "$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"

  update-e2e:
    # An actual update of the compose stack from the last release to this tree, through the
    # updater, with a captain installed; then a refused digest and a rolled-back broken release.
    runs-on: ubuntu-latest
    needs: [images]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the script builds the previous release from its tag
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build packaging
      - run: tests/e2e/update_compose.sh
        timeout-minutes: 40
