# One port for the whole open edition: the dashboard at /, the API at /api/.
events {}
http {
  resolver 127.0.0.11 valid=10s;
  server {
    listen 8080;
    client_max_body_size 25m;

    location /api/ {
      set $upstream_api api;
      proxy_pass http://$upstream_api:8001;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
    }
    location = /health {
      set $upstream_api api;
      proxy_pass http://$upstream_api:8001;
    }
    location /map/ {
      set $upstream_compass compass;
      proxy_pass http://$upstream_compass:8787/;
    }
    location / {
      set $upstream_dashboard dashboard;
      proxy_pass http://$upstream_dashboard:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
