# Compass, locally: the dashboard and API on http://localhost:8080, the daemon,
# and a DynamoDB on this machine. The host needs Docker, an AWS profile in
# ~/.aws and a GitHub token (.env); no source, no Python.
#
#   docker compose run --rm compass init_config workspace=local region=us-east-1 github_repo=<owner>/<repo> terraform_root=<root>
#   docker compose run --rm compass init_tables
#   docker compose up -d                     # http://localhost:8080 (sign in with APP_USERNAME / APP_PASSWORD from .env)
#
# Images: ghcr.io/beamreach-ai/compass and compass-dashboard, published by .github/workflows/release.yml on a tag.
x-compass: &compass
  image: ${COMPASS_IMAGE:-ghcr.io/beamreach-ai/compass:${COMPASS_VERSION:-0.1.0}}
  env_file: .env
  environment:
    AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb:8000
    AWS_PROFILE: ${AWS_PROFILE:-default}
    AWS_REGION: ${AWS_REGION:-us-east-1}
    # Extra captains: pip requirements (PyPI name, git URL, or a wheel dropped in
    # ./extensions/wheels), installed on start and kept in ./extensions.
    COMPASS_EXTENSIONS: ${COMPASS_EXTENSIONS:-}
  volumes:
    - ./config:/compass/config
    - ./map:/compass/map
    - ./extensions:/compass/extensions
    - ${AWS_DIR:-~/.aws}:/root/.aws:ro
  depends_on:
    - dynamodb
  restart: unless-stopped

services:
  dynamodb:
    image: amazon/dynamodb-local
    user: root
    working_dir: /home/dynamodblocal
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/data"]
    volumes:
      - dynamodb-data:/data
    restart: unless-stopped

  # The daemon: decoy alerts, jobs started from the dashboard, the PR watcher, map re-scans.
  compass:
    <<: *compass
    command: ["serve"]

  # The API behind the dashboard.
  api:
    <<: *compass
    command: ["api"]

  dashboard:
    image: ${COMPASS_DASHBOARD_IMAGE:-ghcr.io/beamreach-ai/compass-dashboard:${COMPASS_VERSION:-0.1.0}}
    environment:
      APP_MODE: production
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${COMPASS_PORT:-8080}:8080"
    depends_on:
      - api
      - dashboard
    restart: unless-stopped

volumes:
  dynamodb-data:
