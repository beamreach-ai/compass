# Compass, locally: the dashboard and API on http://localhost:8080, the daemon,
# and a DynamoDB on this machine. The host needs Docker and a GitHub token (.env);
# an AWS profile is used once, by `connect`, to create the roles Compass reads
# through; the running services never see it. No source, no Python.
#
#   docker compose run --rm compass init_config workspace=local region=us-east-1 github_repo=<owner>/<repo> terraform_root=<root>
#   docker compose run --rm compass init_tables
#   docker compose run --rm -v ~/.aws:/root/.aws:ro -e AWS_PROFILE=<profile> compass connect account=<id> region=us-east-1
#   docker compose up -d                     # http://localhost:8080 (sign in with APP_USERNAME / APP_PASSWORD from .env)
#
# Images: ghcr.io/beamreach-ai/compass, compass-dashboard and compass-updater, published by
# .github/workflows/release.yml on a tag. The release workflow keeps the default version below
# at the latest release; COMPASS_VERSION in .env pins yours.
#
# Updates: the dashboard says when a release is out (Settings → Compass). Applying one is
# `docker compose pull && docker compose up -d` after changing COMPASS_VERSION in .env, or one
# click when the updater service runs: `docker compose --profile updater up -d`. The updater
# holds the Docker socket, which is root on this machine; it is off unless you turn it on.
x-compass: &compass
  image: ${COMPASS_IMAGE:-${COMPASS_REGISTRY:-ghcr.io/beamreach-ai}/compass:${COMPASS_VERSION:-0.4.0}}
  env_file: .env
  environment:
    AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb:8000
    # The control region (SES, Secrets Manager; DynamoDB-local does not care). No AWS_PROFILE
    # here and no ~/.aws mount: the services run as the runtime identity `connect` created
    # (config/local.json) and refuse to start with a profile in reach.
    AWS_REGION: ${AWS_REGION:-us-east-1}
    AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
    # What this compose file asked to pull; the dashboard says when it differs from what runs.
    COMPASS_VERSION: ${COMPASS_VERSION:-0.4.0}
    # Extra captains: pip requirements (PyPI name, git URL, or a wheel dropped in
    # ./extensions/wheels), installed on start and kept in ./extensions.
    COMPASS_EXTENSIONS: ${COMPASS_EXTENSIONS:-}
    # The Captains page may restart these services after an install: they run
    # with restart: unless-stopped, so an exit brings them back with the new set.
    COMPASS_SELF_RESTART: "1"
  volumes:
    - ./config:/compass/config
    - ./map:/compass/map
    - ./extensions:/compass/extensions
    # the map: one SQLite file per workspace, shared by the daemon (which writes it) and the API.
    # A named volume, not a bind mount: SQLite's WAL needs the file locks a Docker Desktop bind
    # mount does not guarantee. `compass mapper backup` copies it out while the stack runs.
    - map-data:/compass/data
  depends_on:
    - dynamodb
  restart: unless-stopped

services:
  dynamodb:
    image: amazon/dynamodb-local
    user: root
    working_dir: /home/dynamodblocal
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/data"]
    volumes:
      - dynamodb-data:/data
    restart: unless-stopped

  # The daemon: decoy alerts, jobs started from the dashboard, the PR watcher, map re-scans.
  compass:
    <<: *compass
    command: ["serve"]

  # The API behind the dashboard.
  api:
    <<: *compass
    command: ["api"]

  dashboard:
    image: ${COMPASS_DASHBOARD_IMAGE:-${COMPASS_REGISTRY:-ghcr.io/beamreach-ai}/compass-dashboard:${COMPASS_VERSION:-0.4.0}}
    environment:
      APP_MODE: production
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${COMPASS_PORT:-8080}:8080"
    depends_on:
      - api
      - dashboard
    restart: unless-stopped

  # Off by default (docs/quickstart.md, "Updates"): `docker compose --profile updater up -d`.
  # Applies the update the dashboard or `compass update apply` asks for: pulls the release's
  # images, verifies their digests, sets COMPASS_VERSION in .env and recreates the services,
  # then checks health and rolls back when they do not come up. It is docker:cli plus one
  # shell script (docker/updater), with the Docker socket: whoever controls it controls
  # this machine. This directory is mounted at its own path so the paths compose resolves
  # inside the updater are the host's.
  updater:
    profiles: ["updater"]
    image: ${COMPASS_UPDATER_IMAGE:-${COMPASS_REGISTRY:-ghcr.io/beamreach-ai}/compass-updater:${COMPASS_VERSION:-0.4.0}}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}:${PWD}
      - ./extensions:/compass/extensions
    working_dir: ${PWD}
    environment:
      COMPASS_PROJECT: ${PWD}
      COMPASS_UPDATER_HEALTH_SECONDS: ${COMPASS_UPDATER_HEALTH_SECONDS:-300}
      COMPASS_REGISTRY: ${COMPASS_REGISTRY:-ghcr.io/beamreach-ai}
      COMPASS_VERSION: ${COMPASS_VERSION:-0.4.0}
    restart: unless-stopped

volumes:
  dynamodb-data:
  map-data:
