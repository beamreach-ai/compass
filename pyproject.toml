[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

# The open-source part of this repository as one installable distribution
# (docs/open_source_split_spec.md §2, S6). The product's images still install
# their requirements files and copy the whole tree; this is what the public
# repository will publish, and what lets this repository depend on it later.
[project]
name = "compass-open"
version = "0.5.1"
description = "Beamreach Compass, the open edition: the infra map, decoys, code-as-cloud, the PR watcher, and the API behind the dashboard"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "boto3>=1.39,<2",
    "botocore>=1.39,<2",
    "PyGithub>=2.5,<3",
    "python-hcl2>=4,<9",
    "PyYAML>=6,<7",
    "pydantic>=2,<3",
    "requests>=2.31,<3",
    "cryptography>=44,<46",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "PyJWT>=2.8,<3",
    "python-multipart>=0.0.9",
    "packaging>=23",
    "jsonschema>=4",
]

[project.scripts]
compass = "compass_core.cli:main"

# The captains this distribution ships (compass_core.captains.discover); an
# extension adds its own under the same group.
[project.entry-points."compass.captains"]
core = "compass_core.manifest:MANIFEST"
mapper = "captains.mapper.manifest:MANIFEST"
librarian = "captains.librarian.manifest:MANIFEST"
honeypot = "captains.honeypot.manifest:MANIFEST"
iac = "captains.iac.manifest:MANIFEST"
prs = "captains.prs.manifest:MANIFEST"

[project.optional-dependencies]
# a model for the incident summary, drift-fix HCL and PR triage (compass_core.llm)
anthropic = ["anthropic>=0.40"]
dev = ["pytest", "pytest-asyncio", "httpx", "moto", "pyflakes"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "compass_core*",
    "compass_api*",
    "infra_map*",
    "captains",
    "captains.mapper*",
    "captains.librarian*",
    "captains.honeypot*",
    "captains.iac*",
    "captains.prs*",
]

[tool.setuptools.package-data]
"captains.honeypot" = ["prompts/*.md", "listener/README.md", "listener/Dockerfile"]
"compass_core" = ["catalog.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# tests are imported by path: `captains` is a namespace package, so a `tests`
# directory on sys.path would otherwise contribute tests/captains/* to it
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["dashboard", "docs"]

[tool.ruff.lint]
# pyflakes + the import and bugbear rules that catch real mistakes; style is the reader's job
select = ["E4", "E7", "E9", "F", "B", "I"]
ignore = ["B008", "B904", "E731", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["compass_core", "compass_api", "infra_map", "captains"]
